<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App del clima</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
  <h1>¿Qué tiempo hace?</h1>

  <form id="formulario">
    <label for="ciudad" class="oculto">Ciudad</label>
    <input id="ciudad" type="text" placeholder="Escribe una ciudad" required autocomplete="off">
    <button type="submit">Buscar</button>
  </form>

  <p id="mensaje" role="status" aria-live="polite"></p>

  <div id="escena" class="escena dia" hidden aria-hidden="true">
  <svg viewBox="0 0 300 220">
    <rect class="cielo" width="300" height="220" rx="18"/>
    <g class="estrellas">
      <circle cx="30" cy="30" r="1.5"/><circle cx="90" cy="18" r="1.2"/>
      <circle cx="150" cy="36" r="1.5"/><circle cx="210" cy="20" r="1.2"/>
      <circle cx="260" cy="45" r="1.5"/><circle cx="45" cy="80" r="1.2"/>
      <circle cx="120" cy="70" r="1"/><circle cx="270" cy="95" r="1.2"/>
    </g>
    <circle class="astro" cx="55" cy="50" r="16"/>
    <g class="nubes">
      <ellipse cx="200" cy="40" rx="32" ry="10"/><ellipse cx="225" cy="34" rx="20" ry="9"/>
      <ellipse cx="90" cy="75" rx="26" ry="8"/>
    </g>
    <polygon class="haz" points="164,64 280,36 280,92"/>
    <ellipse class="mar" cx="150" cy="172" rx="132" ry="38"/>
    <path class="arena" d="M70 168 Q88 132 132 130 L192 130 Q228 138 238 162 Q205 188 142 188 Q90 188 70 168Z"/>
    <path class="tronco" d="M100 150 Q104 135 110 124" />
    <g class="hojas"><ellipse cx="104" cy="122" rx="12" ry="4"/><ellipse cx="116" cy="124" rx="10" ry="4"/></g>
    <polygon class="faro" points="139,132 146,72 164,72 171,132"/>
    <polygon class="franja" points="143,104 167,104 168,114 142,114"/>
    <rect class="lampara" x="146" y="62" width="18" height="10"/>
    <polygon class="techo" points="143,62 155,44 167,62"/>
    <rect class="puerta" x="150" y="118" width="9" height="14" rx="4"/>
    <polygon class="vela" points="62,150 62,176 82,176"/>
    <rect class="casco" x="56" y="176" width="32" height="5" rx="2"/>
    <g class="gotas">
      <line x1="40" y1="60" x2="34" y2="76"/><line x1="90" y1="90" x2="84" y2="106"/>
      <line x1="140" y1="50" x2="134" y2="66"/><line x1="200" y1="80" x2="194" y2="96"/>
      <line x1="250" y1="55" x2="244" y2="71"/><line x1="170" y1="110" x2="164" y2="126"/>
    </g>
  </svg>
</div>

  <section id="actual" hidden>
    <h2 id="lugar"></h2>
    <p id="hora" class="hora"></p>
    <p class="temp" id="temp"></p>
    <p id="desc"></p>
    <p id="detalle"></p>
  </section>

  <section id="pronostico" hidden>
    <h2>Próximos días</h2>
    <ul id="dias"></ul>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
